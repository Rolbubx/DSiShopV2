name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  nds:
    name: ROM .nds (BlocksDS)
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.25.0
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances (zlib, Mbed TLS, libcurl)
        run: wf-pacman -Sy --noconfirm toolchain-gcc-arm-none-eabi-zlib blocksds-mbedtls blocksds-libcurl
      - name: Compilation
        run: make -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: DSiShop
          path: DSiShop.nds

  # Sur main : publie la ROM comme release "v<APP_VERSION>" si elle n'existe pas
  # encore. C'est cette release que DSi Shop télécharge pour se mettre à jour :
  # il suffit donc d'augmenter APP_VERSION dans source/app.h.
  release:
    name: Release (mise à jour de DSi Shop)
    needs: [nds, sim]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DSiShop
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(sed -n 's/^#define APP_VERSION "\(.*\)"/\1/p' source/app.h)"
          test "$version" != "v"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "La release $version existe déjà : rien à publier."
          else
            gh release create "$version" DSiShop.nds --target "$GITHUB_SHA" \
              --title "DSi Shop $version" --generate-notes
          fi

  sim:
    name: Simulateur PC (captures d'écran)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilation et exécution
        run: |
          make -C tools/sim
          mkdir -p screenshots
          ./tools/sim/dsishop_sim screenshots
      - name: Tests ZIP / fichiers découpés (dont une archive ZIP64 de 4,5 Go creuse)
        run: make -C tools/test check BIG=--big OUT=$RUNNER_TEMP/zip_tests
      - name: Serveur du catalogue (paquets TWiLight Menu++)
        run: python3 catalog-server/test_twilight.py
      - name: Serveur du catalogue (source Universal-DB)
        run: python3 catalog-server/test_udb.py
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  remote-server:
    name: Serveur Remote (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        working-directory: remote-server
        run: npm test
