name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer les bibliothèques (zlib, Mbed TLS, libcurl)
        run: |
          wf-pacman -Sy --noconfirm \
            toolchain-gcc-arm-none-eabi-zlib blocksds-mbedtls blocksds-libcurl

      - name: Compiler
        run: make -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: DSiShop
          path: DSiShop.nds
          if-no-files-found: error
