name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  nds:
    name: ROM .nds (BlocksDS)
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-v1.25.0
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances (zlib, Mbed TLS, libcurl)
        run: wf-pacman -Sy --noconfirm toolchain-gcc-arm-none-eabi-zlib blocksds-mbedtls blocksds-libcurl
      - name: Compilation
        run: make -j$(nproc)
      - uses: actions/upload-artifact@v4
        with:
          name: DSiShop
          path: DSiShop.nds

  sim:
    name: Simulateur PC (captures d'écran)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilation et exécution
        run: |
          make -C tools/sim
          mkdir -p screenshots
          ./tools/sim/dsishop_sim screenshots
      - name: Tests ZIP / fichiers découpés (dont une archive ZIP64 de 4,5 Go creuse)
        run: make -C tools/test check BIG=--big OUT=$RUNNER_TEMP/zip_tests
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
